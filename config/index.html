<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Configuration</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 24px auto; padding: 0 16px; }
  h1, h2 { margin-top: 24px; }
  h1 { margin-top: 0; }
  .type-row, .status-row { display: flex; gap: 8px; align-items: center; margin: 6px 0; padding: 8px; background: #f9f9f9; border-radius: 6px; flex-wrap: wrap; }
  .type-row input[type="text"], .status-row input[type="text"] { flex: 1; min-width: 120px; padding: 6px; }
  .type-row input[type="color"] { width: 48px; height: 32px; border: none; padding: 0; }
  .type-row button, .status-row button { width: auto; padding: 6px 10px; }
  .preview { width: 24px; height: 24px; border-radius: 4px; border: 1px solid #ccc; }
  .icon-preview { width: 28px; height: 28px; }
  .icon-preview svg { width: 100%; height: 100%; }
  button { padding: 8px 14px; margin: 4px; cursor: pointer; }
  .actions { margin-top: 16px; }
  .id-hint { font-size: 12px; color: #666; min-width: 90px; }
  select { padding: 6px; }
</style>
</head>
<body>
<h1>Configuration</h1>
<p>Edit area types, colors, and status overlays. Changes are shared with the Editor and Navigator.</p>

<h2>Area types</h2>
<div id="types-list"></div>
<button onclick="addType()">+ Add new type</button>

<h2>Status overlays</h2>
<p>For each status choose whether to show text, icon, or both on the floor plan.</p>
<div id="status-list"></div>

<div class="actions">
  <button onclick="save()" style="background:#27ae60;color:white">Save changes</button>
  <button onclick="location.href='../editor/'">Back to Editor</button>
  <button onclick="location.href='../navigator/'">Open Navigator</button>
</div>

<script src="../shared/storage.js"></script>
<script>
let data = loadData();

function renderTypes() {
  const el = document.getElementById('types-list');
  el.innerHTML = data.areaTypes.map((t, i) => `
    <div class="type-row">
      <div class="preview" style="background:${t.color}"></div>
      <span class="id-hint">${t.id}</span>
      <input type="text" value="${escapeHtml(t.label)}" onchange="data.areaTypes[${i}].label=this.value">
      <input type="color" value="${t.color}" onchange="data.areaTypes[${i}].color=this.value; this.parentElement.querySelector('.preview').style.background=this.value">
      <button onclick="moveType(${i},-1)" ${i===0?'disabled':''}>↑</button>
      <button onclick="moveType(${i},1)" ${i===data.areaTypes.length-1?'disabled':''}>↓</button>
      <button onclick="removeType(${i})" style="color:#c0392b">Delete</button>
    </div>
  `).join('');
}

function renderStatuses() {
  const el = document.getElementById('status-list');
  const iconOptions = Object.keys(STATUS_ICONS).map(k => `<option value="${k}">${k}</option>`).join('');
  el.innerHTML = data.statusConfigs.map((s, i) => `
    <div class="status-row">
      <span class="id-hint">${s.id}</span>
      <input type="text" value="${escapeHtml(s.label)}" placeholder="Label" onchange="data.statusConfigs[${i}].label=this.value">
      <select onchange="data.statusConfigs[${i}].mode=this.value">
        <option value="text" ${s.mode==='text'?'selected':''}>Text only</option>
        <option value="icon" ${s.mode==='icon'?'selected':''}>Icon only</option>
        <option value="both" ${s.mode==='both'?'selected':''}>Text + Icon</option>
      </select>
      <select onchange="data.statusConfigs[${i}].icon=this.value; renderStatuses()">
        ${iconOptions.replace(`value="${s.icon}"`, `value="${s.icon}" selected`)}
      </select>
      <div class="icon-preview">${getStatusIconSvg(s.icon)}</div>
      <input type="text" value="${escapeHtml(s.text||'')}" placeholder="Overlay text" onchange="data.statusConfigs[${i}].text=this.value" style="min-width:100px">
    </div>
  `).join('');
}

function escapeHtml(s) {
  return (s||'').replace(/&/g,'&').replace(/</g,'<').replace(/"/g,'"');
}

function addType() {
  const label = prompt('Name of the new area type?');
  if (!label) return;
  const id = label.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'type_' + Date.now();
  if (data.areaTypes.some(t => t.id === id)) {
    alert('A type with a similar id already exists.');
    return;
  }
  data.areaTypes.push({ id, label, color: '#7f8c8d' });
  renderTypes();
}

function removeType(i) {
  if (!confirm('Delete this area type?')) return;
  data.areaTypes.splice(i, 1);
  renderTypes();
}

function moveType(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= data.areaTypes.length) return;
  [data.areaTypes[i], data.areaTypes[j]] = [data.areaTypes[j], data.areaTypes[i]];
  renderTypes();
}

function save() {
  saveData(data);
  alert('Configuration saved.');
}

renderTypes();
renderStatuses();
</script>
</body>
</html>
